[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-first-response"
version = "0.1.0"
description = "HackMIT rehearsal implementation for adaptive ecological first-response planning."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "networkx>=3.2,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
# GNN/RL backbone (Demu's learned-planner block). Deliberately kept out of the
# core `dependencies` list: the environment/Bayes/UI side of the project must
# never need torch installed just to run. Only `adaptive_response.rl` imports
# it. Install with `pip install -e ".[dev,rl]"`.
rl = [
  "torch>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
